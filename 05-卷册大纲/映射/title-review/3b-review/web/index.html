<!DOCTYPE html>
<html lang="zh-Hans" data-theme="dark" data-fs="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3B 标题审定</title>
<meta name="description" content="小节标题审阅工具（内部使用）">
<meta name="theme-color" content="#000000" id="meta-theme">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<header id="topbar">
  <div class="bar-row">
    <div class="brand">3B <em>标题审定</em></div>
    <div class="top-actions">
      <button type="button" id="btn-exit-fs" hidden>退出沉浸</button>
      <button type="button" id="btn-theme" aria-label="切换主题">日间</button>
      <button type="button" id="btn-font" aria-label="切换字号">字号 中</button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text">
      <span><strong id="p-answered">0</strong> / <span id="p-total">0</span></span>
      <span id="p-pct">0%</span>
      <span class="dirty" id="p-dirty" hidden>未同步 0 条</span>
    </div>
  </div>

  <nav class="toolbar" aria-label="工具栏">
    <button type="button" id="btn-view" aria-pressed="false">单卡模式</button>
    <button type="button" id="btn-filter">筛选：全部</button>
    <button type="button" id="btn-goto">定位</button>
    <button type="button" id="btn-resume">继续上次</button>
    <button type="button" id="btn-stats">统计</button>
    <button type="button" id="btn-config">配置</button>
    <button type="button" id="btn-export">导出</button>
  </nav>
</header>

<main id="main">
  <section id="view-group" aria-label="分组列表"></section>
  <section id="view-single" aria-label="单卡模式" hidden></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-msg"></span>
  <button type="button" id="toast-undo" hidden>撤销</button>
</div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">标题</h2>
      <button type="button" class="close" id="sheet-close">关闭</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div class="start-overlay" id="start-overlay">
  <h1>3B 标题审定</h1>
  <p>逐条审阅：点 <b>✓</b> 通过、点 <b>↻</b> 重拟、点 <b>✎</b> 自定义就地改题。状态只由胶囊按钮或整节通过触发，滑动与点击空白不会改变判定。</p>
  <button type="button" class="primary" id="btn-start">开始沉浸审阅</button>
  <button type="button" class="skip" id="btn-start-plain">直接进入</button>
</div>

<noscript><p style="padding:16px">本工具需要启用 JavaScript。</p></noscript>

<script src="./app.js"></script>
</body>
</html>
