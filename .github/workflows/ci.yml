# 编纂工程 CI —— 只收编可在无本地数据库、无浏览器、无人机固定路径环境下判定的门禁。
# 未收编门禁（浏览器视觉回归、无障碍、数据库类、第三十二件扫描面不入库）的原因见 README“CI（GitHub Actions）”。
# 依赖钉定：第三方 action 一律钉定 40 位提交 SHA（行尾注释记语义版本），不随浮动 tag 漂移；
# 升级由 `dependabot.yml` 的 github-actions 生态提 PR，或手工换 SHA＋注释后重跑本工作流。
# 2026-10-29 核：checkout v7.0.1／setup-python v7.1.0／setup-node v7.1.0 为各自最新正式版。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GATES: 00-编纂规则与格式规范/01-规则/脚本与命令
  TESTS: 05-卷册大纲/目录/tests
  DOC: 05-卷册大纲/目录

jobs:
  gates:
    name: 门禁套件
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # fetch-depth 1：无门禁硬依赖历史（第二十件 T1 已固化为仓内快照，见守卫层注释）。
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: 安装 Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      # 第九件（页面资产层）解析 woff2 子集需 fontTools；woff2 编解码另需 brotli。
      # 版本钉定＝第九件本机验证通过的组合（4.62.1／1.2.0）：woff2 解析对版本敏感，
      # 浮动装新易让资产门禁在 CI 侧与本地判定漂移；升级须本地复跑第九件后再改此行。
      - name: 安装页面资产门禁依赖（fontTools==4.62.1＋brotli==1.2.0）
        run: python -m pip install --disable-pip-version-check fonttools==4.62.1 brotli==1.2.0

      - name: 安装 Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: 安装 markdownlint-cli2（第十件钉定 cli2 0.24.0 / markdownlint 0.42.0）
        run: npm install -g markdownlint-cli2@0.24.0 markdownlint@0.42.0

      # 四个闸层一律 continue-on-error：存量红项（另线在修）不应让后续闸层被 skipped 而失去可见性；
      # 真实结论由末步“汇总门禁结果”给出，任一闸层 FAIL 即整轮失败。
      - name: 文本与格式层门禁
        id: g1
        continue-on-error: true
        run: |
          python "$GATES/audit_markdown_lint.py"
          python "$GATES/audit_md_quote_glyphs.py"
          python "$GATES/audit_md_bold_spacing.py"
          python "$GATES/scan_md_invisible.py"
          python "$GATES/audit_js_blockscope.py"
          python "$GATES/audit_mirror_ingest.py"
          python "$GATES/audit_disk_terminology.py"
          python "$GATES/audit_fixture_freshness.py"
          python "$GATES/audit_sidecar_backup.py"
          python "$GATES/audit_keyword_index.py"

      - name: 大纲与目录页结构层门禁
        id: g2
        continue-on-error: true
        run: |
          python "$GATES/audit_index_structure.py"
          python "$GATES/audit_sequence_continuity.py"
          python "$GATES/audit_data_integrity.py"
          python "$GATES/embed.py" --check
          python "$GATES/sync_refactor2026_baseline.py" --check
          python "$GATES/audit_page_assets.py"
          python "$GATES/audit_server_contract.py"
          python "$GATES/audit_page_version_bump.py"

      - name: 守卫、锚与交叉引用层门禁
        id: g3
        continue-on-error: true
        run: |
          python "$GATES/audit_renumber_guard.py"
          # 第二十件 T1 已固化为仓内快照（08-核查报告与多轮复核/重构2026/data/outline-t1-20261011.txt），
          # 不依赖历史对象，浅克隆即可判。
          python "$GATES/audit_silent_loss_guard.py"
          python "$GATES/audit_outline_dup.py"
          # 第三十三／三十四件（成对锚配平、BEGIN/END 章内配对）暂不收编，两条缘由：
          # ① 二者只在带 --check 时才 exit 1，缺省恒 exit 0——原样收编即假绿（2026-10-29 实测）；
          # ② 存量缺损未清：56 件块头／块尾缺失（含正文截断）＋第 71 卷 3.2.1 一处 W172 孤儿 END；
          #    逐件清单与处置口径见 01-项目管理/02-工程决策与技术债/锚配平缺损清单与处置施工单-20261029.md。
          # 清零后恢复调用并显式带 --check。
          python "$GATES/xref_audit.py"
          python "$GATES/audit_note_xref.py"

      - name: 落地与治理层门禁
        id: g4
        continue-on-error: true
        run: |
          # 落地门禁以仓库相对根运行：L13 的“绝对路径 >260”判据锚定本机 Windows 检出，
          # CI 环境改用相对根口径，免因 runner 检出根更长而系统性误判（本机仍按原口径必跑）。
          python "$GATES/audit_outline_landing.py" --root 05-卷册大纲
          python "$GATES/audit_gate_registry.py"
          python "$GATES/audit_engineering_practice.py"
          # 第三十二件（任务生命周期）暂不收编：其扫描面为工作区 `specs/`，按红线不入库，
          # 全新克隆下恒“扫描面缺失”exit 2。本机批流程照跑，CI 侧留待该件改为仓内台账后并入。
          python "$TESTS/outline_selfcheck.py"
          python "$TESTS/tri_structure_negtest.py"

      - name: Python 语法编译检查（CI 专用，非项目门禁）
        run: python -m compileall -q "$GATES" "$TESTS"

      - name: Node 语法冒烟（CI 专用，非项目门禁；浏览器套件仅本机可运行）
        run: |
          for f in "$TESTS"/*.mjs "$DOC"/src/js/*.js "$DOC"/assets/doc.js "$DOC"/assets/theme-preset.js; do
            node --check "$f"
            echo "  OK $f"
          done

      # 末步汇总：各闸层以 outcome（而非 conclusion）判读，避免 continue-on-error 把红项吞成绿。
      - name: 汇总门禁结果（任一闸层 FAIL 即整轮失败）
        if: always()
        run: |
          fail=0
          for layer in "文本与格式层:${{ steps.g1.outcome }}" "大纲与目录页结构层:${{ steps.g2.outcome }}" \
                       "守卫、锚与交叉引用层:${{ steps.g3.outcome }}" "落地与治理层:${{ steps.g4.outcome }}"; do
            name="${layer%%:*}"
            out="${layer##*:}"
            echo "$name → $out"
            if [ "$out" != "success" ]; then fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            echo "::error::门禁套件存在未通过闸层，详见各步日志"
            exit 1
          fi
          echo "全部门禁闸层通过"
